              $ref: "#/components/schemas/StudentDataRequestControlInput"
      responses:
        "201":
          description: Applied control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDataRequestControl"
        "400":
          description: Invalid control scope, reason, or dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: School Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Request not in the current school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Control or audit evidence could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teacher/org/student-data-requests/{id}/controls/{controlId}:
    patch:
      operationId: updateStudentDataRequestControl
      tags: [teacher]
      summary: Append a review, expiry confirmation, or lifting event
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: controlId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentDataRequestControlAction"
      responses:
        "200":
          description: Updated current state with appended immutable event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDataRequestControl"
        "400":
          description: Invalid action evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: School Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Control not in the current school and request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Control already ended or expiry is not due
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Control or audit evidence could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teacher/org/student-data-requests/{id}/export:
    get:
      operationId: exportStudentDataRequest
      tags: [teacher]
      summary: Export only the requested student's school-scoped data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Minimal student data export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDataRequestExport"
        "404":
          description: Request not in the current school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Export not available for this request or student record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Audit evidence could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    RestoreArchivedStudentRecordInput:
      type: object
      properties:
        confirmation:
          type: string
          enum: ["RESTORE TO ACTIVE RECORDS"]
      required: [confirmation]

    RestoreArchivedStudentRecordResult:
      type: object
      properties:
        ok:
          type: boolean
        restored:
          type: boolean
        classId:
          type: integer
        sessionId:
          type: integer
        restoredAt:
          type: string
          format: date-time
      required: [ok, restored, classId, sessionId, restoredAt]

    StudentDataRequestStudent:
      type: object
      properties:
        id:
          type: integer
        studentName:
          type: string
        classId:
          type: integer
        className:
          type: string
        classArchivedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, studentName, classId, className, classArchivedAt]

    StudentDataRequest:
      type: object
      properties:
        id:
          type: integer
        studentSessionId:
          type: ["integer", "null"]
        studentName:
          type: string
        classId:
          type: ["integer", "null"]
        className:
          type: string
        requestType:
          type: string
          enum: [access, correction, deletion]
        reason:
          type: string
        approvalBasis:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, in_review, completed, refused, escalated]
        outcome:
          type: ["string", "null"]
        exportCount:
          type: integer
        lastExportedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, studentSessionId, studentName, classId, className, requestType, reason, approvalBasis, status, outcome, exportCount, lastExportedAt, createdAt, updatedAt, completedAt]

    StudentDataRequestList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StudentDataRequest"
      required: [items]

    StudentDataRequestInput:
      type: object
      properties:
        studentSessionId:
          type: integer
          minimum: 1
        requestType:
          type: string
          enum: [access, correction, deletion]
        reason:
          type: string
          minLength: 3
          maxLength: 2000
        approvalBasis:
          type: string
          minLength: 3
          maxLength: 2000
      required: [studentSessionId, requestType, reason]

    StudentDataRequestUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, in_review, completed, refused, escalated]
        outcome:
          type: string
          minLength: 3
          maxLength: 2000
        approvalBasis:
          type: string
          minLength: 3
          maxLength: 2000
      required: [status]

    StudentDataRequestControlInput:
      type: object
      properties:
        kind:
          type: string
          enum: [restriction, legal_hold, safeguarding_hold]
        reasonCategory:
          type: string
          enum: [accuracy_dispute, objection, legal_claim, complaint, investigation, safeguarding, retention_duty, other]
        reasonSummary:
          type: string
          minLength: 3
          maxLength: 160
          description: Minimal reason reference only; do not include student content or safeguarding narrative.
        affectedDataCategories:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum: [identity, learning, activity, feedback, ai_conversations]
        accessLimits:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [export]
        processingLimits:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [deletion, export]
        startDate:
          type: string
          format: date
        reviewDate:
          type: string
          format: date
        expiryDate:
          type: ["string", "null"]
          format: date
      required: [kind, reasonCategory, reasonSummary, affectedDataCategories, accessLimits, processingLimits, startDate, reviewDate]

    StudentDataRequestControlAction:
      type: object
      properties:
        action:
          type: string
          enum: [review, expire, lift]
        note:
          type: string
          minLength: 3
          maxLength: 240
      required: [action, note]

    StudentDataRequestControlEvent:
      type: object
      properties:
        id: { type: integer }
        eventType:
          type: string
          enum: [applied, reviewed, expired, lifted]
        note: { type: string }
        lifecycleState:
          type: string
          enum: [active, expired, lifted]
        actorTeacherId:
          type: ["integer", "null"]
        occurredAt:
          type: string
          format: date-time
      required: [id, eventType, note, lifecycleState, actorTeacherId, occurredAt]

    StudentDataRequestControl:
      type: object
      properties:
        id: { type: integer }
        requestId:
          type: ["integer", "null"]
        accountableOwnerTeacherId:
          type: ["integer", "null"]
        affectedStudentSessionId:
          type: ["integer", "null"]
        affectedClassId:
          type: ["integer", "null"]
        affectedDataCategories:
          type: array
          items: { type: string }
        kind:
          type: string
          enum: [restriction, legal_hold, safeguarding_hold]
        reasonCategory:
          type: string
          enum: [accuracy_dispute, objection, legal_claim, complaint, investigation, safeguarding, retention_duty, other]
        reasonSummary: { type: string }
        accessLimits:
          type: array
          items: { type: string }
        processingLimits:
          type: array
          items: { type: string }
        startDate: { type: string, format: date-time }
        reviewDate: { type: string, format: date-time }
        expiryDate:
          type: ["string", "null"]
          format: date-time
        lifecycleState:
          type: string
          enum: [active, expired, lifted]
        lastReviewedAt:
          type: ["string", "null"]
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        events:
          type: array
          items:
            $ref: "#/components/schemas/StudentDataRequestControlEvent"
      required: [id, requestId, accountableOwnerTeacherId, affectedStudentSessionId, affectedClassId, affectedDataCategories, kind, reasonCategory, reasonSummary, accessLimits, processingLimits, startDate, reviewDate, expiryDate, lifecycleState, lastReviewedAt, endedAt, createdAt, updatedAt, events]

    StudentDataRequestControlList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StudentDataRequestControl"
      required: [items]

    StudentDataRequestExport:
      type: object
      description: A single student's export. It excludes PIN hashes, session nonces, other students, and class-wide configuration.
      properties:
        exportVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
        request:
          type: object
          additionalProperties: true
        student:
          type: object
          additionalProperties: true
        learning:
          type: object
          additionalProperties: true
        activity:
          type: object
          additionalProperties: true
        feedback:
          type: array
          items:
            type: object
            additionalProperties: true
        aiConversations:
          type: array
          items:
            type: object
            additionalProperties: true
        teacherMessages:
          type: array
          description: Plain-text messages sent by teachers for this student Climb
          items:
            $ref: "#/components/schemas/TeacherMessage"
        includedCategories:
          type: array
          items:
            type: string
          description: Data categories included in this export
        excluded:
          type: array
          items:
            type: string
      required: [exportVersion, generatedAt, request, student, learning, activity, feedback, aiConversations, teacherMessages, includedCategories, excluded]

    SessionStatus:
      type: object
      properties:
        idleExpiresAt:
          type: string
          format: date-time
        absoluteExpiresAt:
          type: string
          format: date-time
      required:
        - idleExpiresAt
        - absoluteExpiresAt

    TeacherProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        isItAdmin:
          type: boolean
        schoolAdminRole:
          type: ["string", "null"]
          enum: [master, subadmin, null]
        canReviewSafeguarding:
          type: boolean
        organisationId:
          type: ["integer", "null"]
        mustChangePassword:
          type: boolean
        totpEnabled:
          type: boolean
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - isItAdmin
        - canReviewSafeguarding
        - mustChangePassword
        - totpEnabled
        - emailVerified
        - createdAt

    TeacherSessionRestoreInput:
      type: object
      properties:
        sessionResumeToken:
          type: string
          minLength: 40
          maxLength: 200
      required: [sessionResumeToken]

    TeacherSessionRestoreResponse:
      allOf:
        - $ref: "#/components/schemas/TeacherProfile"
        - type: object
          properties:
            mustChangePassword:
              type: boolean
            totpEnabled:
              type: boolean
          required: [mustChangePassword, totpEnabled]

    TeacherDirectoryItem:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        isItAdmin:
          type: boolean
        schoolAdminRole:
          type: ["string", "null"]
          enum: [master, subadmin, null]
        canReviewSafeguarding:
          type: boolean
        accountStatus:
          type: string
          enum: [active, suspended, deleted]
        accountStatusChangedAt:
          type: ["string", "null"]
          format: date-time
        approvalStatus:
          type: string
          enum: [pending, approved, rejected]
        approvalReviewedAt:
          type: ["string", "null"]
          format: date-time
        approvalReviewedBy:
          type: ["integer", "null"]
        approvalReason:
          type: ["string", "null"]
        totpEnabled:
          type: boolean
        mustChangePassword:
          type: boolean
        failedLoginAttempts:
          type: integer
        lockedUntil:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - isItAdmin
        - canReviewSafeguarding
        - accountStatus
        - accountStatusChangedAt
        - approvalStatus
        - approvalReviewedAt
        - approvalReviewedBy
        - approvalReason
        - totpEnabled
        - mustChangePassword
        - failedLoginAttempts
        - lockedUntil
        - createdAt

    TeacherApprovalDecision:
      type: object
      properties:
        ok:
          type: boolean
        approvalStatus:
          type: string
          enum: [approved, rejected]
      required: [ok, approvalStatus]

    TeacherApprovalRejection:
      type: object
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
      required: [reason]

    TeacherDirectoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeacherDirectoryItem"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 1
      required:
        - items
        - total
        - page
        - pageSize
        - totalPages

    SafeguardingReviewerPermissionInput:
      type: object
      properties:
        canReviewSafeguarding:
          type: boolean
        confirmation:
          type: string
          maxLength: 180
      required: [canReviewSafeguarding]

    SafeguardingReviewerPermissionResponse:
      type: object
      properties:
        id:
          type: integer
        canReviewSafeguarding:
          type: boolean
      required: [id, canReviewSafeguarding]

    SafeguardingCategory:
      type: string
      enum:
        - self_harm_or_suicide
        - harm_by_another_person
        - sexual_abuse_or_exploitation
        - serious_violence_or_threat
        - grooming_coercion_or_blackmail
        - immediate_danger
        - other_serious_concern
        - provider_safety_signal

    SafeguardingProviderSignal:
      type: object
      properties:
        provider:
          type: string
          enum: [azure, gemini]
        categories:
          type: array
          items:
            type: string
            maxLength: 80
      required: [provider, categories]

    SafeguardingReviewItemSummary:
      type: object
      properties:
        id:
          type: integer
        caseReference:
          type: string
        category:
          $ref: "#/components/schemas/SafeguardingCategory"
        technicalReason:
          type: string
        status:
          type: string
          enum: [new, under_review, closed]
        sourceType:
          type: string
          enum: [student_ai, climb]
        sourceLocation:
          type: string
        studentName:
          type: string
        className:
          type: string
        createdAt:
          type: string
          format: date-time
        reviewerName:
          type: ["string", "null"]
      required:
        - id
        - caseReference
        - category
        - technicalReason
        - status
        - sourceType
        - sourceLocation
        - studentName
        - className
        - createdAt
        - reviewerName

    SafeguardingReviewItemListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SafeguardingReviewItemSummary"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalPages:
          type: integer
          minimum: 1
      required: [items, total, page, pageSize, totalPages]

    SafeguardingReviewAuditEntry:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
        createdAt:
          type: string
          format: date-time
        actorName:
          type: ["string", "null"]
        metadata:
          type: object
          additionalProperties: true
      required: [id, action, createdAt, actorName, metadata]

    SafeguardingReviewItemDetail:
      allOf:
        - $ref: "#/components/schemas/SafeguardingReviewItemSummary"
        - type: object
          properties:
            schoolName:
              type: string
            excerpt:
              type: string
            surroundingContext:
              type: string
            detectedBy:
              type: string
              enum: [local, provider, both]
            providerSignals:
              type: array
              items:
                $ref: "#/components/schemas/SafeguardingProviderSignal"
            reviewerId:
              type: ["integer", "null"]
            reviewerEmail:
              type: ["string", "null"]
            reviewedAt:
              type: ["string", "null"]
              format: date-time
            actionTaken:
              type: ["string", "null"]
            decision:
              type: ["string", "null"]
            rationale:
              type: ["string", "null"]
            outcome:
              type: ["string", "null"]
            externalReference:
              type: ["string", "null"]
            notificationStatus:
              type: string
            updatedAt:
              type: string
              format: date-time
            closedAt:
              type: ["string", "null"]
              format: date-time
            auditHistory:
              type: array
              items:
                $ref: "#/components/schemas/SafeguardingReviewAuditEntry"
          required:
            - schoolName
            - excerpt
            - surroundingContext
            - detectedBy
            - providerSignals
            - reviewerId
            - reviewerEmail
            - reviewedAt
            - actionTaken
            - decision
            - rationale
            - outcome
            - externalReference
            - notificationStatus
            - updatedAt
            - closedAt
            - auditHistory

    SafeguardingReviewItemDetailResponse:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/SafeguardingReviewItemDetail"
      required: [item]

    SafeguardingReviewItemUpdateInput:
      type: object
      properties:
        status:
          type: string
          enum: [new, under_review, closed]
        actionTaken:
          type: string
          maxLength: 2000
        decision:
          type: string
          maxLength: 500
        rationale:
          type: string
          maxLength: 3000
        outcome:
          type: string
          maxLength: 2000
        externalReference:
          type: string
          maxLength: 250


    TeacherDepartureClass:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        subject:
          type: ["string", "null"]
        archivedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, name, subject, archivedAt]

    TeacherDepartureTeacher:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        accountStatus:
          type: string
          enum: [active, suspended, deleted]
      required: [id, name, email, accountStatus]

    TeacherDepartureSummary:
      type: object
      properties:
        teacher:
          $ref: "#/components/schemas/TeacherDepartureTeacher"
        classes:
          type: array
          items:
            $ref: "#/components/schemas/TeacherDepartureClass"
        studentCount:
          type: integer
          minimum: 0
      required: [teacher, classes, studentCount]

    TeacherDepartureInput:
      oneOf:
        - type: object
          properties:
            actions:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/TeacherDepartureClassAction"
            confirmation:
              type: string
              const: REMOVE ACCESS
          required: [actions, confirmation]
        - type: object
          properties:
            outcome:
              type: string
              const: transfer
            transfers:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/TeacherDepartureTransfer"
            replacementTeacherId:
              type: integer
              minimum: 1
            confirmation:
              type: string
              const: REMOVE ACCESS
          required: [outcome, confirmation]
        - type: object
          properties:
            outcome:
              type: string
              const: archive
            retentionUntil:
              type: string
              pattern: '^\d{4}-\d{2}-\d{2}$'
            reason:
              type: string
              minLength: 3
              maxLength: 500
            confirmation:
              type: string
              const: REMOVE ACCESS
          required: [outcome, retentionUntil, reason, confirmation]

    TeacherDepartureClassAction:
      oneOf:
        - type: object
          properties:
            action:
              type: string
              const: transfer
            classId:
              type: integer
              minimum: 1
            replacementTeacherId:
              type: integer
              minimum: 1
          required: [action, classId, replacementTeacherId]
        - type: object
          properties:
            action:
              type: string
              const: archive
            classId:
              type: integer
              minimum: 1
            reason:
              type: string
              minLength: 3
              maxLength: 500
          required: [action, classId]

    TeacherDepartureTransfer:
      type: object
      properties:
        classId:
          type: integer
          minimum: 1
        replacementTeacherId:
          type: integer
          minimum: 1
      required: [classId, replacementTeacherId]

    TeacherDepartureResult:
      type: object
      properties:
        ok:
          type: boolean
        kind:
          type: string
          enum: [transferred, archived]
        classCount:
          type: integer
          minimum: 0
        archivedClassIds:
          type: array
          items:
            type: integer
        transferredClassIds:
          type: array
          items:
            type: integer
        retentionDays:
          type: integer
          minimum: 1
        retentionUntil:
          type: ["string", "null"]
          format: date-time
      required: [ok, kind, classCount, archivedClassIds, transferredClassIds]

    OrganisationClassTransferInput:
      type: object
      properties:
        replacementTeacherId:
          type: integer
          minimum: 1
        confirmation:
          type: string
          const: TRANSFER CLASS
      required: [replacementTeacherId, confirmation]

    OrganisationClassTransferResult:
      type: object
      properties:
        ok:
          type: boolean
        kind:
          type: string
          const: transferred
        classId:
          type: integer
        replacementTeacherId:
          type: integer
        replacementName:
          type: string
      required: [ok, kind, classId, replacementTeacherId, replacementName]

    ArchivedTeacherClassActionInput:
      oneOf:
        - type: object
          properties:
            action:
              type: string
              const: restore
            teacherId:
              type: integer
              minimum: 1
          required: [action, teacherId]
        - type: object
          properties:
            action:
              type: string
              const: schedule-deletion
            confirmation:
              type: string
              const: DELETE
          required: [action, confirmation]

    ArchivedTeacherClassActionResult:
      type: object
      properties:
        ok:
          type: boolean
        kind:
          type: string
          enum: [restored, scheduled]
        classId:
          type: integer
        replacementTeacherId:
          type: integer
        archiveRemoved:
          type: boolean
        deletionScheduledFor:
          type: string
          format: date-time
      required: [ok, kind, classId]

    TeacherRestoreResult:
      type: object
      properties:
        ok:
          type: boolean
        restored:
          type: boolean
        accountStatus:
          type: string
          const: active
        accountStatusChangedAt:
          type: string
          format: date-time
        archiveRemoved:
          type: boolean
      required: [ok, restored, accountStatus, accountStatusChangedAt, archiveRemoved]

    TeacherRecordArchive:
      type: object
      properties:
        id:
          type: integer
        teacherId:
          type: integer
        teacherName:
          type: string
        teacherEmail:
          type: string
          format: email

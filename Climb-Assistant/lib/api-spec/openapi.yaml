openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Teacher authentication
  - name: teacher
    description: Teacher operations
  - name: student
    description: Student operations
  - name: admin
    description: CIG Platform Administrator operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/activity-log/report:
    get:
      operationId: exportPlatformActivityLogReport
      tags: [admin]
      summary: Export a redacted Platform Activity Log report
      description: Returns a bounded CSV report using the selected activity category, action, and UTC date filters. Access is limited to the Master CIG administrator.
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [administrator-security, school-administration]
        - name: action
          in: query
          schema:
            type: string
          description: Valid platform activity action
        - name: from
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive start date in UTC
        - name: to
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive end date in UTC
      responses:
        "200":
          description: Redacted CSV activity report, bounded to 500 matching entries
          headers:
            X-Activity-Report-Count:
              schema:
                type: integer
            X-Activity-Report-Truncated:
              schema:
                type: boolean
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid activity filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Master CIG administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: registerTeacher
      tags: [auth]
      summary: Register a teacher
      description: A valid school invite code is required. Registration remains pending until a school administrator approves it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherRegistration"
      responses:
        "201":
          description: Registered and awaiting school approval; email verification and authenticator setup are still required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherRegistrationPendingResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: loginTeacher
      tags: [auth]
      summary: Log in as a teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    get:
      operationId: verifyTeacherEmail
      tags: [auth]
      summary: Verify a teacher email address with a single-use link
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 40
            maxLength: 200
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherEmailVerificationResult"
        "400":
          description: Invalid, expired, or already-used verification link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      operationId: resendTeacherEmailVerification
      tags: [auth]
      summary: Send a new teacher email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherEmailVerificationInput"
      responses:
        "200":
          description: Verification request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherEmailVerificationResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/session/restore:
    post:
      operationId: restoreTeacherSession
      tags: [auth]
      summary: Restore a one-time post-MFA teacher session
      description: Exchanges a short-lived, single-use handoff ticket for a new secure server session after an embedded webview loses the initial session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherSessionRestoreInput"
      responses:
        "200":
          description: Session restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherSessionRestoreResponse"
        "400":
          description: Invalid session recovery request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Expired or already-used session recovery ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getTeacherMe
      tags: [auth]
      summary: Get current teacher
      responses:
        "200":
          description: Current teacher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logoutTeacher
      tags: [auth]
      summary: Log out
      responses:
        "204":
          description: Logged out

  /teacher/org/teachers:
    get:
      operationId: listOrganisationTeachers
      tags: [teacher]
      summary: List teachers in the current school
      description: Returns a school-scoped, filtered, sorted, and paginated teacher directory for School Admins and permitted School Sub-admins.
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
          description: Case-insensitive match against teacher name or email
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, suspended, deleted]
            default: active
        - name: approvalStatus
          in: query
          schema:
            type: string
            enum: [all, pending, approved, rejected]
            default: all
        - name: from
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive account creation date in UTC
        - name: to
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Inclusive account creation date in UTC
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, createdAt, status]
            default: name
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: School-scoped teacher directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDirectoryResponse"
        "400":
          description: Invalid directory filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: School Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No school is associated with the current teacher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teacher/org/teacher/{id}/safeguarding-reviewer:
    put:
      operationId: setSafeguardingReviewerPermission
      tags: [teacher]
      summary: Assign or remove Safeguarding Reviewer permission
      description: School Admin only. Assignment requires the school's exact authorization confirmation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafeguardingReviewerPermissionInput"
      responses:
        "200":
          description: Permission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeguardingReviewerPermissionResponse"
        "400":
          description: Invalid confirmation or request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: School Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Teacher not found in the current school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teacher/safeguarding/items:
    get:
      operationId: listSafeguardingReviewItems
      tags: [teacher]
      summary: List Safeguarding Review Items
      description: Safeguarding Reviewer permission is required. Results are restricted to the reviewer's school.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, new, under_review, closed]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
      responses:
        "200":
          description: School-scoped review queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeguardingReviewItemListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Safeguarding Reviewer permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teacher/safeguarding/items/{id}:
    get:
      operationId: getSafeguardingReviewItem
      tags: [teacher]
      summary: Open a Safeguarding Review Item
      description: Opening a review item is recorded in the restricted audit history.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Review item details and audit history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeguardingReviewItemDetailResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Safeguarding Reviewer permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Review item not found in the current school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSafeguardingReviewItem
      tags: [teacher]
      summary: Record human review of a Safeguarding Review Item
      description: Updates are recorded in the restricted audit history. The system does not recommend a safeguarding decision.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafeguardingReviewItemUpdateInput"
      responses:
        "200":
          description: Updated review item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeguardingReviewItemDetailResponse"
        "400":
          description: Invalid review fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Safeguarding Reviewer permission required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Review item not found in the current school
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teacher/org/teacher/{id}/approve:
    post:
      operationId: approveTeacherRegistration
      tags: [teacher]
      summary: Approve a pending teacher registration
      description: School Admins and permitted School Sub-admins may approve a pending registration in their own school.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Registration approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherApprovalDecision" }
        "400": { description: Invalid request }
        "403": { description: School administrator access required }
        "409": { description: Registration has already been reviewed }

  /teacher/org/teacher/{id}/reject:
    post:
      operationId: rejectTeacherRegistration
      tags: [teacher]
      summary: Reject a pending teacher registration
      description: School Admins and permitted School Sub-admins may reject a pending registration in their own school, with an auditable reason.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherApprovalRejection" }
      responses:
        "200":
          description: Registration rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherApprovalDecision" }
        "400": { description: Invalid request }
        "403": { description: School administrator access required }
        "409": { description: Registration has already been reviewed }

  /teacher/org/teacher/{id}/departure-summary:
    get:
      operationId: getTeacherDepartureSummary
      tags: [teacher]
      summary: Review records before a teacher departure
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: School-scoped summary of the departing teacher's records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDepartureSummary"
        "400":
          description: Invalid teacher account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: School Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Teacher not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teacher/org/teacher/{id}/departure:
    post:
      operationId: manageTeacherDeparture
      tags: [teacher]
      summary: Archive or transfer a departing teacher's records
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherDepartureInput"
      responses:
        "200":
          description: Teacher access was removed and records were transferred or archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherDepartureResult"
        "400":
          description: Invalid departure choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: School Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Departure record changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teacher/org/teacher/{id}/restore:
    post:
      operationId: restoreTeacherAccount
      tags: [teacher]
      summary: Restore a deleted teacher account during the recovery period
      description: A School Master may restore a deleted teacher in the same organisation only until accountStatusChangedAt plus deletionRecoveryDays.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Teacher account restored without reclaiming transferred classes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherRestoreResult"
        "400": { description: Invalid teacher restore request }
        "403": { description: School Master access required }
        "404": { description: Teacher not found in the organisation }
        "409": { description: "Account is not deleted, changed, or outside recovery period" }

  /teacher/org/record-archives:
    get:
      operationId: listTeacherRecordArchives
      tags: [teacher]
      summary: List archived departing-teacher records
      responses:
        "200":
          description: School-scoped teacher record archives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherRecordArchiveList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: School Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teacher/org/classes/{classId}/transfer:
    post:
      operationId: transferOrganisationClass
      tags: [teacher]
      summary: Transfer one active class to another active teacher
      description: School Masters may transfer a class within their organisation without changing either teacher account.
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationClassTransferInput"
      responses:
        "200":
          description: Class ownership was transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationClassTransferResult"
        "400": { description: Invalid transfer request }
        "403": { description: School Master access required }
        "404": { description: Class not found in the organisation }
        "409": { description: "Class is archived, scheduled for deletion, or changed" }

  /teacher/org/record-archives/{archiveId}:
    get:
      operationId: getTeacherRecordArchive
      tags: [teacher]
      summary: View a read-only archived teacher record
      parameters:
        - name: archiveId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: School-scoped archived classes and student record summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherRecordArchiveDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: School Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Archive not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Archive retention date has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teacher/org/record-archives/{archiveId}/classes/{classId}/action:
    post:
      operationId: actOnArchivedTeacherClass
      tags: [teacher]
      summary: Restore or schedule deletion for one archived class
      description: School Masters may restore an archived class to an active same-school teacher or schedule its recoverable deletion.
      parameters:
        - name: archiveId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: classId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchivedTeacherClassActionInput"
      responses:
        "200":
          description: Archived class action completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchivedTeacherClassActionResult"
        "400": { description: Invalid archived-class action or replacement teacher }
        "403": { description: School Master access required }
        "404": { description: Archive or class not found }
        "409": { description: "Archive retention, legal hold, request control, or class lifecycle conflict" }

  /teacher/org/record-archives/{archiveId}/classes/{classId}/students/{sessionId}:
    post:
      operationId: accessArchivedTeacherStudentRecord
      tags: [teacher]
      summary: View detailed student work and chats within an archived teacher record
      parameters:
        - name: archiveId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: classId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchivedRecordAccessRequest"
      responses:
        "200":
          description: Retained student learning record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherRecordArchiveStudentDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: School Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Archived class or student record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Archive retention date has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Audit record could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teacher/org/record-archives/{archiveId}/export:
    post:
      operationId: exportTeacherRecordArchive
      tags: [teacher]
      summary: Export detailed student work and chats from an archived teacher record
      parameters:
        - name: archiveId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchivedRecordAccessRequest"
      responses:
        "200":
          description: Detailed school-scoped archive export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherRecordArchiveExport"
        "400":
          description: Purpose statement or confirmation is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: School Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Archive not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Archive retention date has ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Audit record could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /teacher/org/record-archives/{archiveId}/permanent-delete:
    post:
      operationId: permanentlyDeleteTeacherRecordArchive
      tags: [teacher]
      summary: Permanently delete an expired teacher record archive
      parameters:
        - name: archiveId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherRecordArchivePermanentDeleteInput"
      responses:
        "200":
          description: Archived live records permanently deleted
          content:
